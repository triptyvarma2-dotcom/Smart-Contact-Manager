<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
 th:replace="base::Layout(~{::section})"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this is signup page</title>
</head>
<body>
    <section class="Banner d-flex justify-content-center align-items-center">
        <div class="container">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <div class="my-card">

                        <!-- <div th:if="${session.message}" th:classappend="${session.message.type}" class="alert" role="alert">
                            <p class="text-center" th:text="${session.message.content}"></p>
                            <th:block th:text="${#session.removeAttribute('message')}"></th:block>
                        </div> -->
                        <div th:if="${session.message}"
                            th:classappend="${session.message.type}"
                            class="alert" role="alert">

                            <p class="text-center"
                            th:text="${session.message.content}">
                            </p>

                        </div>






                        <div class="container text-center">

                            <img style="width: 70px;" src="" th:src="@{/img/register.png}" alt="image">
                        


                        </div>
                        <h2 class="text-center"> Register Here!!</h2>
                     <form novalidate action="" th:action="@{/do_register}" method="post" th:object="${user}" >
                        <!-- Name field -->
                    
                        <div class="form-field">

                            
                    <label for="name_field">Name</label>
                    <input name="name" type="text" class="form-control" 
                    th:classappend="${#fields.hasErrors('name') ? 'is-invalid':''}"
                    id="name-field"
                    aria-describedby="nameHelp"
                    placeholder="Enter Your Name"
                    required th:value="${user.name}">
                    <div class="invalid-feedback" th:each="e : ${#fields.errors('name')}" th:text="${e}">
                        
                    </div>
                    
                    </div>

                    <!-- Email field -->
                    
                        <div class="form-field">

                            
                    <label for="email_field">Email</label>
                    <input name="email"  type="email" class="form-control" 
                    th:classappend="${#fields.hasErrors('email') ? 'is-invalid':''}"
                    id="email-field"
                    aria-describedby="emailHelp"
                    placeholder="Enter Your Email"
                    required th:value="${user.email}">
                    <div class="invalid-feedback" th:each="e : ${#fields.errors('email')}" th:text="${e}">
                        
                    </div>
                    </div>

                    <!-- Password field -->
                    
                        <!-- <div class="form-field">

                            
                    <label for="password_field">Password</label>
                    <input name="password" type="password" class="form-control"
                    th:classappend="${#fields.hasErrors('password') ? 'is-invalid':''}"
                    id="password-field"
                    aria-describedby="passwordHelp"
                    placeholder="Enter Your Password"
                    required th:value="${user.password}">
                    <div class="invalid-feedback" th:each="e : ${#fields.errors('password')}" th:text="${e}">
                        
                    </div>
                    </div> -->


                        <!-- Password field -->
                        <div class="form-field">

                            <label for="password-field">Password</label>

                            <div style="position:relative;">

                                <input name="password"
                                    type="password"
                                    class="form-control"
                                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid':''"
                                    id="password-field"
                                    aria-describedby="passwordHelp"
                                    placeholder="Enter Your Password"
                                    required
                                    th:value="${user.password}"
                                    style="padding-right:45px; background-image:none;">

                                <button type="button"
                                        aria-label="Show or hide password"
                                        style="position:absolute; right:10px; top:19px; transform:translateY(-50%); border:0; background:transparent; color:#198754; cursor:pointer; padding:4px;"
                                        onclick="
                                            var p = document.getElementById('password-field');
                                            var slash = document.getElementById('eyeSlash');
                                            p.type = p.type === 'password' ? 'text' : 'password';
                                            slash.style.display = p.type === 'text' ? 'block' : 'none';
                                        ">

                                    <svg width="22" height="22" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">

                                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                        <line id="eyeSlash" x1="3" y1="3" x2="21" y2="21"
                                            style="display:none;"/>

                                    </svg>
                                </button>

                                <div class="invalid-feedback"
                                    th:each="e : ${#fields.errors('password')}"
                                    th:text="${e}">
                                </div>

                            </div>
                        </div>


                    <!-- About field -->
                    
                        <div class="form-field">
                            <label for="about">About</label>
                            <textarea name="about" th:text="${user.about}" placeholder="Enter something about yourself"  rows="4" class="form-control"
                            th:classappend="${#fields.hasErrors('about') ? 'is-invalid':''}"
                            ></textarea>
                            <div class="invalid-feedback" th:each="e : ${#fields.errors('about')}" th:text="${e}">
                        
                    </div>
                    
                    </div>

                    <div class="form-group form-check">
                        <input type="checkbox" name="agreement" class="form-check-input"id="agreement">
                  
                        <label for="agreement">Accept T&C</label>
                    </div>


                    
                    
                    <div class="container text-center">
                        <button type="submit" class="btn bg-primary text-white">Submit</button>
                        <button type="reset" class="btn btn-warning text-white">Reset</button>
                    </div>



                     </form>
                        
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </section>
   <script th:src="@{/js/script.js}"></script>
</body>
</html>
